<h2 mat-dialog-title>{{ Mst_name }}</h2>

<div mat-dialog-content>
  <form [formGroup]="formInstance">

    <!-- Gewässer -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Gewässer auswählen</mat-label>
      <mat-select
        formControlName="idgewaesser"
        (selectionChange)="onGewaesserChange($event.value)">
        
        <mat-option *ngFor="let g of dropdownGewaesserList"
                    [value]="g.idgewaesser">
          {{ g.gewaessername }}
        </mat-option>

      </mat-select>
    </mat-form-field>

    <!-- Messstelle -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Messstelle auswählen</mat-label>
      <mat-select
        formControlName="id_mst"
        (selectionChange)="onMessstelleChange($event.value)">
        
        <mat-option *ngFor="let m of dropdownMeldeMst"
                    [value]="m.id_mst">
          {{ m.namemst }}
        </mat-option>

      </mat-select>
    </mat-form-field>

  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary"
          [disabled]="formInstance.invalid"
          (click)="save()">
    Änderungen speichern
  </button>

  <button mat-button mat-dialog-close>
    Abbrechen
  </button>
</div>
