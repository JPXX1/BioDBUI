<div class="scroll-container">

  <table mat-table [dataSource]="dataSource" class="table">

    <ng-container *ngFor="let colName of displayedColumns; index as i"
                  [matColumnDef]="colName">

      <th mat-header-cell *matHeaderCellDef
          class="header-table-jahr sticky-header th">
        {{ displayColumnNames[i] }}
      </th>

      <td mat-cell *matCellDef="let element"
          [style.background-color]="
            isYearColumn(colName)
              ? getColor(element.werte[getIndex(colName)], element)
              : null
          "
          class="Zelle">

        {{ isYearColumn(colName)
            ? element.werte[getIndex(colName)]
            : element[colName] }}

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</div>
